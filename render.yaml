services:
  - type: web
    name: agent-mail-service
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        sync: false # Render injects PORT automatically
      - key: SMTP_PORT
        value: "2525"
      - key: AGENT_MAIL_TOKEN
        sync: false # set a long random token in the Render dashboard
      - key: AGENT_MAIL_INBOUND_SECRET
        sync: false # same value as AGENT_MAIL_INBOUND_SECRET on error-inbox and INBOUND_SECRET on the Cloudflare Email Worker
      - key: MAIL_DOMAIN
        sync: false # NOTE: Render cannot receive SMTP; for real mail use docker-compose.yml (see README)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
