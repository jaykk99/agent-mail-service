services:
  - type: web
    name: agent-mail-service
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        sync: false # Render injects PORT automatically
      - key: SMTP_PORT
        value: "2525"
      - key: AGENT_MAIL_TOKEN
        sync: false # set a long random token in the Render dashboard
      - key: AGENT_MAIL_INBOUND_SECRET
        sync: false # same value as AGENT_MAIL_INBOUND_SECRET on error-inbox and INBOUND_SECRET on the Cloudflare Email Worker
      - key: MAIL_DOMAIN
        sync: false # NOTE: Render cannot receive SMTP; for real mail use docker-compose.yml (see README)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SMTP_RELAY_HOST
        sync: false # outbound relay for POST /api/send; unset = sends answer 503
      - key: SMTP_RELAY_PORT
        value: "587"
      - key: SMTP_RELAY_USER
        sync: false
      - key: SMTP_RELAY_PASS
        sync: false
      - key: SEND_MAX_PER_HOUR
        value: "100"
      - key: OUTBOUND_PROVIDER
        sync: false # smtp (default), resend or brevo
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SEND_MAX_PER_DAY
        value: "0"
      - key: SIGNUP_OPEN
        value: "1"
      - key: ADDRESS_QUOTA_PER_ACCOUNT
        value: "25"
      - key: DKIM_DOMAIN
        sync: false # defaults to MAIL_DOMAIN
      - key: DKIM_SELECTOR
        value: "mail"
      - key: DKIM_PRIVATE_KEY
        sync: false # PEM RSA key from `openssl genrsa -out dkim.pem 2048`
      - key: DMARC_POLICY
        value: "none"
