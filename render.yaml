services:
  - type: web
    name: agent-mail-service
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SMTP_ENABLED
        value: "0"
      - key: MAIL_DOMAIN
        value: agents.local
      - key: AGENT_COUNT
        value: "1000"
      - key: DATA_DIR
        value: ./data
      - key: DKIM_SELECTOR
        value: mail
      - key: DMARC_POLICY
        value: none
