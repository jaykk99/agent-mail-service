# Dovecot config for the agent-mail-service stack (Linux).
#
# Install: copy to /etc/dovecot/dovecot.conf (install-validate.sh does this),
# replacing __MAIL_DOMAIN__ and the cert paths. Validated live 2026-11-20
# (Dovecot 2.3.21): IMAP login over TLS :993 with a real SHA512-CRYPT
# password from the provisioned dovecot-users file, then fetch.
#
# Gotcha found during validation: the passwd-file lookups run in the auth
# worker (user `dovenull`), NOT as root. The dovecot-users file and every
# parent directory must be readable/traversable by that user, or every
# login fails with "[UNAVAILABLE] Temporary authentication failure".
# Use mode 640 root:dovecot on the file (auth worker is in the dovecot
# group on Debian/Ubuntu) and 755 on the parent dirs. A 700 root-only
# directory breaks all logins.

protocols = imap
listen = *
ssl = required
ssl_cert = </etc/ssl/certs/__MAIL_DOMAIN__.pem
ssl_key = </etc/ssl/private/__MAIL_DOMAIN__.key
mail_location = maildir:%h
passdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/dovecot-users
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/dovecot-users
}
