; Asterisk Manager Interface (AMI) config snippet for the Calling-linux
; originate path (server.ts -> 127.0.0.1:5038).
;
; Install: merge into /etc/asterisk/manager.conf (install-validate.sh does
; this). The stock Ubuntu manager.conf enables AMI on 127.0.0.1:5038 but
; defines NO manager user, so AMI login fails until a user exists.
;
; The secret comes from /etc/linux-carrier-1000/env (AMI_SECRET, generated
; by install-validate.sh). Never put a real secret in this file in the repo.
; The [linuxcarrier] user below is the default AMI_USER in server.ts.
; Permit only loopback: AMI is never exposed to the network.

[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1

[linuxcarrier]
secret = __AMI_SECRET__
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = system,call,log,verbose,agent,user,config,dtmf,reporting,cdr,dialplan,originate
write = system,call,agent,user,config,command,reporting,originate
