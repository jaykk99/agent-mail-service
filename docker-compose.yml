# Self-hosted stack: zero third-party APIs or secret env vars required.
services:
  mail:
    build: .
    restart: unless-stopped
    environment:
      MAIL_DOMAIN: "${MAIL_DOMAIN:-agents.local}"
      SMTP_PORT: "2525"
      PORT: "3000"
      DATA_DIR: "/app/data"
    ports:
      - "25:2525"
      - "3000:3000"
    volumes:
      - mail_data:/app/data
volumes:
  mail_data:
