name: Independent Agent City public web/API probe
on:
  pull_request:
    paths:
      - 'scripts/verify-agent-city-public.mjs'
      - '.github/workflows/agent-city-external-probe.yml'
  workflow_dispatch:
jobs:
  independent-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production Agent City from an outside Linux network
        run: node scripts/verify-agent-city-public.mjs
