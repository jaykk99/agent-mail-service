name: Combined Docker packaging and loopback integration

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'server.js'
      - 'lib/**'
      - '.github/workflows/combined-docker-loopback.yml'
  workflow_dispatch:

jobs:
  combined-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reject high-severity production dependency advisories
        run: |
          npm audit --omit=dev --audit-level=high --json > audit-report.json || echo 'npm audit reported findings; evaluating JSON'
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
          if (report.error) {
            console.error('npm audit failed:', report.error.message || report.error);
            process.exit(1);
          }
          const findings = Object.entries(report.vulnerabilities || {})
            .filter(([, entry]) => ['high', 'critical'].includes(entry.severity));
          for (const [name, entry] of findings) {
            console.error('SECURITY:', name, entry.severity, JSON.stringify(entry.via), 'fixAvailable=', JSON.stringify(entry.fixAvailable));
          }
          if (findings.length || (report.metadata?.vulnerabilities?.high || 0) || (report.metadata?.vulnerabilities?.critical || 0)) {
            console.error('FAIL: high/critical production dependency advisories');
            process.exit(1);
          }
          console.log('PASS: no high/critical production dependency advisories');
          NODE
      - name: Overlay reviewed loopback Compose from PR 15
        run: |
          git fetch --no-tags origin 5709b485e3b175c9bae8cbfbd05cd797d83b41ef
          git show FETCH_HEAD:docker-compose.yml > docker-compose.yml
      - name: Validate combined Compose configuration
        run: docker compose config --quiet
      - name: Build and start combined image
        run: docker compose up --build --detach --wait
      - name: Verify published sockets and service listeners
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const {execFileSync} = require('node:child_process');
          const id = execFileSync('docker', ['compose','ps','-q','mail'], {encoding:'utf8'}).trim();
          assert.ok(id, 'mail container must exist');
          const ports = JSON.parse(execFileSync('docker', ['inspect','--format','{{json .NetworkSettings.Ports}}',id], {encoding:'utf8'}));
          for (const [internal, external] of [['2525/tcp','25'],['3000/tcp','3000']]) {
            assert.ok(ports[internal]?.length, internal + ' must be published');
            assert.ok(ports[internal].every(p => p.HostIp === '127.0.0.1' && p.HostPort === external),
              internal + ' must bind only 127.0.0.1:' + external);
          }
          console.log('PASS: SMTP and HTTP published exclusively on 127.0.0.1');
          NODE
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:3000/; then break; fi
            sleep 1
          done
          curl --silent --output /dev/null --max-time 5 http://127.0.0.1:3000/
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/25; IFS= read -r line <&3; [[ "$line" == 220* ]]'
      - name: Reject connections through non-loopback host interface
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const os = require('node:os');
          const net = require('node:net');
          const addresses = Object.values(os.networkInterfaces()).flat()
            .filter(i => i && i.family === 'IPv4' && !i.internal).map(i => i.address);
          assert.ok(addresses.length, 'runner must have a non-loopback IPv4 interface');
          function probe(host, port) {
            return new Promise((resolve, reject) => {
              const socket = net.connect({host, port});
              socket.setTimeout(2000);
              socket.once('connect', () => {socket.destroy(); reject(new Error(host + ':' + port + ' unexpectedly reachable'));});
              socket.once('timeout', () => {socket.destroy(); reject(new Error(host + ':' + port + ' timed out (inconclusive)'));});
              socket.once('error', error => {
                socket.destroy();
                if (error.code === 'ECONNREFUSED') resolve();
                else reject(error);
              });
            });
          }
          (async () => {
            for (const address of addresses) {
              for (const port of [25, 3000]) {
                await probe(address, port);
                console.log('PASS: non-loopback ' + address + ':' + port + ' refused');
              }
            }
          })().catch(e => {console.error(e); process.exitCode = 1;});
          NODE
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
