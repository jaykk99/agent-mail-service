name: External Forge3D branch verification
on:
  push:
    branches: [qa/forge3d-architecture-external-20261121]
  workflow_dispatch:
jobs:
  verify-forge3d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout public Forge3D feature branch
        uses: actions/checkout@v4
        with:
          repository: jaykk99/forge3d
          ref: feature/agent-city-architecture-pbr-20261121
          path: forge3d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Forge3D dependencies
        run: npm ci
        working-directory: forge3d
      - name: Verify JavaScript syntax
        run: |
          node --check js/builders/city.js
          node --check js/builders/agentcity-plan.js
          node --check js/builders/agentcity-architecture.js
        working-directory: forge3d
      - name: Run architecture and export tests
        run: node --test test/agentcity-plan.test.js
        working-directory: forge3d
      - name: Run full Forge3D test suite
        run: npm test
        working-directory: forge3d
      - name: Re-export blueprint and check statistics
        run: |
          npm run export:agentcity
          node -e "const p=require('./dist/agentcity-architecture.json'); if(p.buildings.length < 300 || p.districts.length !== 12) process.exit(2); console.log(JSON.stringify({buildings:p.buildings.length,areas:p.districts.length}));"
        working-directory: forge3d
