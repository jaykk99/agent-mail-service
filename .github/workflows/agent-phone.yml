name: Agent Phone (standard-library tests)
on:
  pull_request:
    paths:
      - 'phone/**'
      - 'linux/**'
      - 'monico-mail-usb/**'
      - 'test/test_linux*.py'
      - 'test/test_phone*.py'
      - 'start.sh'
      - '.github/workflows/agent-phone.yml'
  push:
    paths:
      - 'phone/**'
      - 'linux/**'
      - 'monico-mail-usb/**'
      - 'test/test_linux*.py'
      - 'start.sh'
      - 'test/test_phone*.py'
      - '.github/workflows/agent-phone.yml'
permissions:
  contents: read
jobs:
  phone-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify on system Python (no pip installs)
        run: |
          python3 --version
          python3 -m py_compile phone/provision.py phone/server.py phone/mcp.py phone/start.py phone/internal_mail.py phone/usb_storage.py phone/webphone.py phone/probe_public.py linux/manage.py linux/public_manage.py linux/autostart.py linux/watchdog.py linux/release_gate.py
          sh -n start.sh
          bash -n linux/install.sh
          python3 -m unittest discover -s test -p 'test_phone*.py' -v
          python3 -m unittest discover -s test -p 'test_linux*.py' -v
      - name: Validate generated Linux autostart unit using systemd-analyze
        run: |
          python3 linux/autostart.py --dry-run > "$RUNNER_TEMP/monico-agent.service"
          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze verify "$RUNNER_TEMP/monico-agent.service"
          else
            echo "No systemd-analyze on runner; syntax covered by unit tests"
          fi
      - name: Parse browser JavaScript syntax (CI only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class ScriptParser(HTMLParser):
              scripts = []
              in_script = False
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.in_script = True
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.in_script = False
              def handle_data(self, value):
                  if self.in_script:
                      self.scripts.append(value)
          import subprocess
          for idx, file in enumerate(('phone/index.html', 'phone/webphone_guest.html')):
              p = ScriptParser()
              p.scripts = []
              p.feed(Path(file).read_text())
              dest = Path(f'/tmp/agent-phone-ui-{idx}.js')
              dest.write_text('\n'.join(p.scripts))
              subprocess.run(['node', '--check', str(dest)], check=True)
          PY

  thousand-agent-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate and route 1000 real HTTP agent messages on Linux
        run: |
          python3 phone/ci/verify_1000_http.py

  full-linux-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start both Linux services using the unified launcher
        env:
          TEST_STATE: ${{ runner.temp }}/monico-full
        run: |
          mkdir -p "$TEST_STATE"
          chmod 700 "$TEST_STATE"
          bash start.sh --full up --install --state-dir "$TEST_STATE"
          bash start.sh --full status --state-dir "$TEST_STATE" > "$RUNNER_TEMP/monico-status.json"
          python3 - "$RUNNER_TEMP/monico-status.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          assert r['internal_network_usable'], r
          assert r['phone_online_local'] and r['mcp_online_local'], r
          assert r['mailbox_domain'] == 'agents.local'
          assert r['mailbox_count'] == 0
          assert r['public_internet_mail_verified'] is False
          print("Both live Linux services started with private storage")
          PY
          bash start.sh --full invites --count 2 --state-dir "$TEST_STATE" > "$RUNNER_TEMP/invites.json"
          python3 - "$RUNNER_TEMP/invites.json" "$TEST_STATE" <<'PY'
          import json, sys
          from pathlib import Path
          import importlib.util
          p = Path.cwd() / 'linux/manage.py'
          spec = importlib.util.spec_from_file_location('manager', p)
          mgr = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mgr)
          invitation = json.load(open(sys.argv[1]))['codes'][0]
          _, _, reg = mgr.registry(Path(sys.argv[2]))
          account = mgr.MailboxClaims(reg).claim(invitation, 'support-center')
          assert account['email'] == 'support-center@agents.local'
          assert reg.mailbox_count() == 1
          print('Self-selected account and secrets persisted successfully')
          PY
          # This is a CI-only certificate test identity, NOT an owned public IP.
          # Check full-stack opt-in HTTPS startup via localhost using the same identity store.
          bash start.sh --full up --state-dir "$TEST_STATE" --public-ip 8.8.8.8 --allow-public > "$RUNNER_TEMP/public-start.json"
          python3 - "$RUNNER_TEMP/public-start.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          gateway=data['public_browser_gateway']
          assert gateway['local_https_running']
          assert gateway['outside_network_verified'] is False
          assert data['mail_accounts']==1
          print("Three local Linux services healthy; internet access still unverified")
          PY
          bash start.sh --full doctor --state-dir "$TEST_STATE" > "$RUNNER_TEMP/monico-doctor.json"
          python3 - "$RUNNER_TEMP/monico-doctor.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['fastmcp_installed'] and r['mailbox_count']==1
          assert not r['postfix_dovecot_verified'] and not r['public_domain_verified']
          assert r['public_browser_gateway']['local_https_running']
          assert not r['public_browser_gateway']['outside_network_verified']
          print("Doctor separated working local services from unverified public delivery")
          PY
          bash start.sh --full release --scope local --state-dir "$TEST_STATE" > "$RUNNER_TEMP/release-cli.json"
          python3 linux/release_gate.py --scope local --state-dir "$TEST_STATE" > "$RUNNER_TEMP/release-local.json"
          python3 - "$RUNNER_TEMP/release-local.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert result['ready'] and result['scope']=='local', result
          assert all(c['pass'] for c in result['checks']), result
          assert result['public_internet_email_verified'] is False
          print('Local deployment RELEASE GATE: PASS without public claims')
          PY
          if python3 linux/release_gate.py --scope all --state-dir "$TEST_STATE" > "$RUNNER_TEMP/release-public.json"; then
            echo "SECURITY ERROR: falsely claimed public production readiness" >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/release-public.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert not result['ready'] and result['local_ready']
          assert not result['public_pstn_sms_verified']
          print('External deployment RELEASE GATE: BLOCKED until real-world verification')
          PY
          sha256sum "$TEST_STATE/monico/linux-config.json" "$TEST_STATE/monico/agents.sqlite3" > "$RUNNER_TEMP/pre-restart-hashes"
          bash start.sh --full stop --state-dir "$TEST_STATE"
          bash start.sh --full up --state-dir "$TEST_STATE"
          bash start.sh --full status --state-dir "$TEST_STATE" > "$RUNNER_TEMP/restarted.json"
          python3 - "$RUNNER_TEMP/restarted.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['phone_online_local'] and r['mcp_online_local']
          assert r['mailbox_count']==1
          assert r['mailbox_domain']=='agents.local'
          print("Restart preserved both services and self-selected mailbox identity")
          PY
          sha256sum -c "$RUNNER_TEMP/pre-restart-hashes"
      - name: Stop both Linux services and show process logs on failure
        if: always()
        env:
          TEST_STATE: ${{ runner.temp }}/monico-full
        run: |
          bash start.sh --full stop --state-dir "$TEST_STATE" || true
          if [ -d "$TEST_STATE/monico" ]; then
            tail -50 "$TEST_STATE/monico/mcp.log" || true
          fi
