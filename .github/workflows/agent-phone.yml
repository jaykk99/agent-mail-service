name: Agent Phone (standard-library tests)
on:
  pull_request:
    paths:
      - 'phone/**'
      - 'test/test_phone*.py'
      - 'start.sh'
      - '.github/workflows/agent-phone.yml'
  push:
    paths:
      - 'phone/**'
      - 'test/test_phone*.py'
      - '.github/workflows/agent-phone.yml'
permissions:
  contents: read
jobs:
  phone-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify on system Python (no pip installs)
        run: |
          python3 --version
          python3 -m py_compile phone/provision.py phone/server.py phone/mcp.py phone/start.py phone/internal_mail.py phone/usb_storage.py
          sh -n start.sh
          python3 -m unittest discover -s test -p 'test_phone*.py' -v
      - name: Parse browser JavaScript syntax (CI only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class ScriptParser(HTMLParser):
              scripts = []
              in_script = False
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.in_script = True
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.in_script = False
              def handle_data(self, value):
                  if self.in_script:
                      self.scripts.append(value)
          p = ScriptParser()
          p.feed(Path('phone/index.html').read_text())
          Path('/tmp/agent-phone-ui.js').write_text('\n'.join(p.scripts))
          PY
          node --check /tmp/agent-phone-ui.js
